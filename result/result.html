<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FullShot — capture</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="result.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="dot" aria-hidden="true"></span>
        <h1 id="app-name">FullShot</h1>
      </div>
      <div class="meta">
        <strong id="meta-domain">…</strong>
        <span class="muted" id="meta-line">…</span>
      </div>
      <button id="new-capture" class="btn btn-sm" type="button">New capture</button>
    </header>

    <p id="warning" class="warning" hidden></p>

    <main class="layout">
      <section class="stage" aria-label="Screenshot preview">
        <div class="tools" role="toolbar" aria-label="Annotation tools">
          <button class="tool is-active" data-tool="none" type="button" aria-pressed="true" title="Move / no tool">Cursor</button>
          <button class="tool" data-tool="arrow" type="button" aria-pressed="false" title="Arrow">Arrow</button>
          <button class="tool" data-tool="rect" type="button" aria-pressed="false" title="Rectangle">Box</button>
          <button class="tool" data-tool="blur" type="button" aria-pressed="false" title="Blur a region">Blur</button>
          <button class="tool" data-tool="text" type="button" aria-pressed="false" title="Text label">Text</button>
          <span class="tool-sep" aria-hidden="true"></span>
          <span class="swatches" role="radiogroup" aria-label="Annotation colour">
            <button class="swatch is-active" data-color="#ef4444" style="--c:#ef4444" type="button" role="radio" aria-checked="true" aria-label="Red"></button>
            <button class="swatch" data-color="#3b82f6" style="--c:#3b82f6" type="button" role="radio" aria-checked="false" aria-label="Blue"></button>
            <button class="swatch" data-color="#22c55e" style="--c:#22c55e" type="button" role="radio" aria-checked="false" aria-label="Green"></button>
            <button class="swatch" data-color="#18181b" style="--c:#18181b" type="button" role="radio" aria-checked="false" aria-label="Black"></button>
          </span>
          <span class="tool-sep" aria-hidden="true"></span>
          <button id="undo" class="tool" type="button" title="Undo last annotation (Ctrl/Cmd+Z)">Undo</button>
          <button id="clear" class="tool" type="button" title="Remove every annotation">Clear</button>
        </div>

        <div class="canvas-wrap" id="canvas-wrap">
          <canvas id="preview" aria-label="Captured page"></canvas>
          <input id="text-input" class="text-input" type="text" hidden aria-label="Annotation text" />
        </div>
      </section>

      <aside class="panel" aria-label="Export options">
        <div class="field">
          <span class="field-label">Format</span>
          <div class="segmented" role="radiogroup" aria-label="Image format">
            <button class="seg is-active" data-format="png" type="button" role="radio" aria-checked="true">PNG</button>
            <button class="seg" data-format="jpg" type="button" role="radio" aria-checked="false">JPG</button>
          </div>
        </div>

        <div class="field" id="quality-field" hidden>
          <label class="field-label" for="quality">Quality</label>
          <select id="quality">
            <option value="70">70%</option>
            <option value="80">80%</option>
            <option value="90">90%</option>
            <option value="100" selected>100%</option>
          </select>
        </div>

        <div class="field">
          <label class="check">
            <input type="checkbox" id="client-footer" />
            <span>
              <span class="check-title">Client footer</span>
              <span class="muted check-desc">Burn URL, date and viewport into the image</span>
            </span>
          </label>
        </div>

        <div class="actions">
          <button id="download" class="btn btn-primary" type="button">Download</button>
          <button id="copy" class="btn" type="button">Copy image</button>
          <button id="copy-client" class="btn" type="button">Copy for client</button>
        </div>

        <dl class="stats">
          <div><dt>Size</dt><dd id="stat-size">—</dd></div>
          <div><dt>Sections</dt><dd id="stat-tiles">—</dd></div>
          <div><dt>Time</dt><dd id="stat-time">—</dd></div>
          <div><dt>File</dt><dd id="stat-bytes">—</dd></div>
        </dl>

        <p class="status muted" id="status" role="status" aria-live="polite"></p>
      </aside>
    </main>

    <script type="module" src="result.js"></script>
  </body>
</html>
