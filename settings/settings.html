<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FullShot — settings</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body>
    <main class="page">
      <header class="head">
        <h1 id="app-name">FullShot</h1>
        <p class="muted">Settings — everything is stored locally on this device.</p>
      </header>

      <section class="card">
        <h2>Export</h2>

        <div class="row">
          <label for="format">
            <span class="row-title">Image format</span>
            <span class="muted row-desc">Default format on the result page.</span>
          </label>
          <select id="format">
            <option value="png">PNG</option>
            <option value="jpg">JPG</option>
            <option value="pdf">PDF</option>
          </select>
        </div>

        <div class="row">
          <label for="pdfMode">
            <span class="row-title">PDF layout</span>
            <span class="muted row-desc">
              One page as tall as the screenshot, or as many A4 pages as it takes.
            </span>
          </label>
          <select id="pdfMode">
            <option value="single">Single page</option>
            <option value="a4">A4 pages</option>
          </select>
        </div>

        <div class="row">
          <label for="jpgQuality">
            <span class="row-title">JPG quality</span>
            <span class="muted row-desc">
              Lower means smaller files and softer text. PDF pages use it too.
            </span>
          </label>
          <select id="jpgQuality">
            <option value="70">70%</option>
            <option value="80">80%</option>
            <option value="90">90%</option>
            <option value="100">100%</option>
          </select>
        </div>

        <div class="row">
          <label for="filenameTemplate">
            <span class="row-title">Filename</span>
            <span class="muted row-desc">
              Variables: <code>{domain}</code> <code>{title}</code> <code>{date}</code>
              <code>{time}</code>
            </span>
          </label>
          <input id="filenameTemplate" type="text" spellcheck="false" />
        </div>

        <p class="preview muted" id="filename-preview">…</p>
      </section>

      <section class="card">
        <h2>Capture</h2>

        <div class="row">
          <label for="delay">
            <span class="row-title">Capture delay</span>
            <span class="muted row-desc">
              How long to wait after each scroll. Use Safe on heavy pages with lazy images.
            </span>
          </label>
          <select id="delay">
            <option value="fast">Fast</option>
            <option value="normal">Normal</option>
            <option value="safe">Safe</option>
          </select>
        </div>

        <div class="row">
          <label for="hideFixed">
            <span class="row-title">Hide sticky elements</span>
            <span class="muted row-desc">
              Keeps headers, cookie bars and chat bubbles from repeating in every section.
            </span>
          </label>
          <input id="hideFixed" type="checkbox" />
        </div>

        <div class="row">
          <label for="clientFooter">
            <span class="row-title">Client footer by default</span>
            <span class="muted row-desc">
              Pre-tick the option that burns URL, date and viewport into the image.
            </span>
          </label>
          <input id="clientFooter" type="checkbox" />
        </div>
      </section>

      <section class="card">
        <h2>Keyboard shortcut</h2>
        <p class="muted" id="shortcut-line">…</p>
        <button id="open-shortcuts" class="btn btn-sm" type="button">Change shortcut</button>
      </section>

      <footer class="foot">
        <button id="reset" class="btn btn-sm" type="button">Reset to defaults</button>
        <span class="status muted" id="status" role="status" aria-live="polite"></span>
      </footer>
    </main>

    <script type="module" src="settings.js"></script>
  </body>
</html>
