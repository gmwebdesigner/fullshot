<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FullShot</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="head">
        <h1 id="app-name">FullShot</h1>
        <button
          id="settings"
          class="icon-btn"
          type="button"
          aria-label="Open settings"
          title="Settings"
        >
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8" />
            <path
              d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.56V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.56V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9v.1a1.7 1.7 0 0 0 1.56 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"
              stroke="currentColor"
              stroke-width="1.4"
            />
          </svg>
        </button>
      </header>

      <p class="subtitle muted" id="page-host">Capture this page</p>

      <button id="capture" class="btn btn-primary" type="button">Capture full page</button>

      <fieldset class="modes">
        <legend class="sr-only">Capture mode</legend>

        <label class="mode">
          <input type="radio" name="mode" value="full" checked />
          <span class="mode-body">
            <span class="mode-title">Full page</span>
            <span class="mode-desc muted">Scroll and stitch the whole document</span>
          </span>
        </label>

        <label class="mode">
          <input type="radio" name="mode" value="visible" />
          <span class="mode-body">
            <span class="mode-title">Visible area</span>
            <span class="mode-desc muted">Only what you can see right now</span>
          </span>
        </label>

        <label class="mode">
          <input type="radio" name="mode" value="area" />
          <span class="mode-body">
            <span class="mode-title">Selected area</span>
            <span class="mode-desc muted">Drag to pick a region</span>
          </span>
        </label>
      </fieldset>

      <p class="status" id="status" role="status" aria-live="polite"></p>

      <footer class="foot muted">
        <span>Full page</span>
        <span class="kbd" id="shortcut">⌘⇧Y</span>
      </footer>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
